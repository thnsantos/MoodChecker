<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <title>Verificador de humor</title>
  <link rel="stylesheet" href="styles.css/index.css">
</head>
<body>
  <div class="form-stage">
    <form class="container-login" id="login-form" novalidate>
      <div>
        <h1>Entrar</h1>
        <h2>Realize sua Autenticação</h2>
      </div>

      <label for="register">Matrícula</label>
      <input type="text" name="register" id="register" inputmode="numeric" pattern="[0-9]*" maxlength="10" required>

      <label for="password">Senha</label>
      <input type="password" name="password" id="password" required>
      <a href="#">Esqueceu a senha?</a>

      <button type="submit">Entrar</button>

      <div class="register-prompt">
        <span></span>
        <p>Caso não tenha registro, <a href="#">Registre agora</a></p>
        <span></span>
      </div>
    </form>

    <form class="container-login checkin-section hidden" id="checkin-form" novalidate>
    <h1>Seu Check-in</h1>
    <p>Responda as perguntas abaixo:</p>
    <div class="checkin-divider" aria-hidden="true"></div>

    <fieldset class="mood-selection">
      <legend>Como está seu humor hoje?</legend>

      <div class="mood-options">
        <label class="mood-option">
          <input type="radio" name="mood" value="muito-feliz">
          <span class="mood-card" aria-hidden="true">&#128513;</span>
          <span class="mood-name">Muito feliz</span>
        </label>

        <label class="mood-option">
          <input type="radio" name="mood" value="feliz">
          <span class="mood-card" aria-hidden="true">&#128578;</span>
          <span class="mood-name">Feliz</span>
        </label>

        <label class="mood-option">
          <input type="radio" name="mood" value="neutro">
          <span class="mood-card" aria-hidden="true">&#128528;</span>
          <span class="mood-name">Neutro</span>
        </label>

        <label class="mood-option">
          <input type="radio" name="mood" value="triste">
          <span class="mood-card" aria-hidden="true">&#128577;</span>
          <span class="mood-name">Triste</span>
        </label>

        <label class="mood-option">
          <input type="radio" name="mood" value="muito-triste">
          <span class="mood-card" aria-hidden="true">&#128543;</span>
          <span class="mood-name">Muito triste</span>
        </label>
      </div>
    </fieldset>

    <fieldset class="mood-questions">
      <legend>Como você está se sentindo hoje?</legend>

      <div class="rating-options">
        <label class="rating-option">
          <input type="radio" name="number" value="1">
          <span class="rating-circle">1</span>
          <span class="rating-label">Muito bom</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="number" value="2">
          <span class="rating-circle">2</span>
          <span class="rating-label">Bom</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="number" value="3">
          <span class="rating-circle">3</span>
          <span class="rating-label">Médio</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="number" value="4">
          <span class="rating-circle">4</span>
          <span class="rating-label">Ruim</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="number" value="5">
          <span class="rating-circle">5</span>
          <span class="rating-label">Muito ruim</span>
        </label>
      </div>
    </fieldset>

    <fieldset class="mood-questions extra-scale">
      <legend>Como está seu nível de energia hoje?</legend>

      <div class="rating-options">
        <label class="rating-option">
          <input type="radio" name="energy" value="1">
          <span class="rating-circle">1</span>
          <span class="rating-label">Muito baixo</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="energy" value="2">
          <span class="rating-circle">2</span>
          <span class="rating-label">Baixo</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="energy" value="3">
          <span class="rating-circle">3</span>
          <span class="rating-label">Normal</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="energy" value="4">
          <span class="rating-circle">4</span>
          <span class="rating-label">Alto</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="energy" value="5">
          <span class="rating-circle">5</span>
          <span class="rating-label">Muito alto</span>
        </label>
      </div>
    </fieldset>

    <fieldset class="mood-questions extra-scale">
      <legend>Você está conseguindo se concentrar bem?</legend>

      <div class="rating-options">
        <label class="rating-option">
          <input type="radio" name="focus" value="1">
          <span class="rating-circle">1</span>
          <span class="rating-label">Muito difícil</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="focus" value="2">
          <span class="rating-circle">2</span>
          <span class="rating-label">Difícil</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="focus" value="3">
          <span class="rating-circle">3</span>
          <span class="rating-label">Médio</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="focus" value="4">
          <span class="rating-circle">4</span>
          <span class="rating-label">Fácil</span>
        </label>

        <label class="rating-option">
          <input type="radio" name="focus" value="5">
          <span class="rating-circle">5</span>
          <span class="rating-label">Muito fácil</span>
        </label>
      </div>
    </fieldset>

    <div class="message-box">
      <label for="thoughts">O que você está pensando agora?</label>
      <textarea id="thoughts" name="thoughts" rows="4" placeholder="Escreva aqui..."></textarea>
    </div>

      <button type="submit" class="submit-btn">Enviar</button>
    </form>
  </div>

  <script src="scripts.js"></script>
</body>
</html>
