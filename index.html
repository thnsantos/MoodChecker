<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Newsreader:ital,opsz,wght@0,6..72,200..800;1,6..72,200..800&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <title>Verificador de humor</title>
  <link rel="stylesheet" href="styles.css/index.css">
</head>
<body>
  <section class="container">
    <form class="container-login">
      <div>
        <h1>Entrar</h1>
        <h2>Realize sua Autenticação</h2>
      </div>

      <label for="register">Matrícula</label>
      <input type="text" name="register" id="register">

      <label for="password">Senha</label>
      <input type="password" name="password" id="password">
      <a href="#">Esqueceu a senha?</a>

      <button type="submit">Entrar</button>

      <div class="register-prompt">
        <span></span>
        <p>Caso não tenha registro, <a href="#">Registre agora</a></p>
        <span></span>
      </div>
    </form>
  </section>

  <section class="container-login checkin-section">
    <h1>Seu Check-in</h1>
    <p>Responda as perguntas abaixo:</p>
    <div class="checkin-divider" aria-hidden="true"></div>

    <fieldset class="mood-selection">
      <legend>Como está seu humor hoje?</legend>

      <div class="mood-options">
        <label class="mood-option">
          <input type="radio" name="mood" value="muito-feliz">
          <span class="mood-card" aria-hidden="true">&#128513;</span>
          <span class="mood-name">Muito feliz</span>
        </label>

        <label class="mood-option">
          <input type="radio" name="mood" value="feliz">
          <span class="mood-card" aria-hidden="true">&#128578;</span>
          <span class="mood-name">Feliz</span>
        </label>

        <label class="mood-option">
          <input type="radio" name="mood" value="neutro">
          <span class="mood-card" aria-hidden="true">&#128528;</span>
          <span class="mood-name">Neutro</span>
        </label>

        <label class="mood-option">
          <input type="radio" name="mood" value="triste">
          <span class="mood-card" aria-hidden="true">&#128577;</span>
          <span class="mood-name">Triste</span>
        </label>

        <label class="mood-option">
          <input type="radio" name="mood" value="muito-triste">
          <span class="mood-card" aria-hidden="true">&#128543;</span>
          <span class="mood-name">Muito triste</span>
        </label>
      </div>
    </fieldset>

    <fieldset class="mood-questions">
      <legend>Perguntas de 1 a 5</legend>
      
      <label>
        <input type="radio" name="number" id="number">
        1
      </label>

      <label>
        <input type="radio" name="number" id="number">
        2
      </label>

      <label>
        <input type="radio" name="number" id="number">
        3
      </label>

      <label>
        <input type="radio" name="number" id="number">
        4
      </label>
      
      <label>
        <input type="radio" name="number" id="number">
        5
      </label>
    </fieldset>
  </section>

  <script src="scripts.js"></script>
</body>
</html>
